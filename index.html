<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Agências Zeradas – CSV</title>
<style>
  :root{
    --bb:#003399; --am:#FFCC00; --ink:#111827; --mut:#6b7280; --ln:#e5e7eb;
    --r:18px; --sh:0 16px 40px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    background:#f9fafc; color:var(--ink); margin:0; padding:28px;
  }
  .wrap{max-width:1200px;margin:0 auto}
  h1{margin:0 0 8px;font-size:28px}
  .sub{color:var(--mut);margin-bottom:18px}
  .card{background:#fff;border:1px solid var(--ln);border-radius:24px;box-shadow:var(--sh);padding:22px;margin:16px 0}
  label{font-weight:700;font-size:14px;margin-bottom:8px;display:block}
  select,input[type=file],button{
    width:100%;padding:12px 14px;border:1px solid var(--ln);
    border-radius:14px;background:#fff;font-size:14px;
  }
  .btn{background:var(--bb);color:#fff;border:none;border-radius:12px;
       padding:12px 16px;font-weight:800;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--bb);border:1px solid var(--bb)}
  .pill{display:inline-block;background:#eef2ff;border:1px solid #dfe6ff;
        color:#0b1a66;padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px;margin:6px 8px 0 0}
  table{width:100%;border-collapse:collapse;margin-top:10px;border:1px solid var(--ln);
        border-radius:14px;overflow:hidden}
  th,td{padding:10px 12px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px}
  th{background:#f8fafc;font-weight:700} tbody tr:hover{background:#f3f6ff}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title{font-weight:900;color:var(--bb)} .badge{background:var(--am);color:#111;padding:4px 10px;border-radius:999px;font-weight:900;font-size:12px}
  .empty{color:var(--mut);font-style:italic;padding:10px 0}
  .row{display:grid;gap:14px}
  @media(min-width:860px){.row.cols-2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Agências com % de Atingimento Zerado</h1>
  <div class="sub">Processa exclusivamente <b>arquivos CSV</b> e exibe, para cada coluna de "% de Atingimento", as agências com valor igual a 0.</div>

  <div class="card">
    <div class="row cols-2">
      <div>
        <label>Arquivo CSV</label>
        <input id="file" type="file" accept=".csv"/>
        <div style="font-size:12.5px;color:#6b7280;margin-top:6px">Use delimitador padrão (vírgula). Valores podem estar em formato 0,00% ou 0%.</div>
      </div>
      <div>
        <label>Opções</label>
        <div><input id="emptyAsZero" type="checkbox" checked/> Tratar células vazias como zero</div>
      </div>
    </div>

    <div class="row cols-2" style="margin-top:14px">
      <div><label>Coluna: Prefixo</label><select id="colPrefixo" disabled></select></div>
      <div><label>Coluna: Agência</label><select id="colAgencia" disabled></select></div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <button id="analisar" class="btn" disabled>Gerar Listas</button>
      <button id="baixarTudo" class="btn ghost" disabled>Baixar Todos os CSVs</button>
    </div>

    <div id="resumo" style="margin-top:8px"></div>
  </div>

  <div id="saida"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let rows=[], headers=[], prefixCol='', agenciaCol='', itemCols=[], cache={};

function parseCSV(text){
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim()!=='');
  if(!lines.length)return[];
  const headers=lines[0].split(',').map(h=>h.trim());
  const data=[];
  for(let i=1;i<lines.length;i++){
    const parts=lines[i].split(',');const obj={};
    for(let j=0;j<headers.length;j++)obj[headers[j]]=parts[j]?.trim()??'';
    data.push(obj);
  }
  return data;
}
function cleanHeader(h){return String(h||'').trim();}
function guess(hdrs,keys){const lc=hdrs.map(h=>[h,h.toLowerCase()]);
  for(const k of keys){const hit=lc.find(([o,l])=>l.includes(k));if(hit)return hit[0];}
  return hdrs[0]||'';
}
function isPctAtingHeader(h){const s=h.toLowerCase();return s.includes('%')&&s.includes('ating');}
function toNumberBR(v){
  if(v==null)return null;if(typeof v==='number')return v;
  let s=String(v).trim();if(!s)return null;
  s=s.replace(/\s+/g,'').replace(/%/g,'').replace(/R\$/gi,'');
  if(s.match(/\d\.\d{3}/)&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  s=s.replace(/[^0-9.\-]/g,'');
  if(!s||s==='-'||s==='.')return null;
  const n=Number(s);return Number.isFinite(n)?n:null;
}
function uniqByPrefixAgencia(items,cP,cA){
  const m=new Map();
  for(const r of items){
    const p=(r[cP]??'').trim(),a=(r[cA]??'').trim();
    if(!p&&!a)continue;m.set(`${p}||${a}`,r);
  }
  return [...m.values()];
}
function toCSV(rows,cols){
  const esc=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const out=[cols.map(esc).join(',')];
  for(const r of rows)out.push(cols.map(c=>esc(r[c])).join(','));
  return out.join('\n');
}
function download(name,content){
  const blob=new Blob([content],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  URL.revokeObjectURL(url);
}
function fillSelect(sel,opts,selVal){
  sel.innerHTML='';
  for(const o of opts){const op=document.createElement('option');op.value=o;op.textContent=o;sel.appendChild(op);}
  if(selVal)sel.value=selVal;
}
function renderResumo(){
  const total=new Set(rows.map(r=>`${(r[prefixCol]??'').trim()}||${(r[agenciaCol]??'').trim()}`)).size;
  $('#resumo').innerHTML=`<span class="pill">Agências únicas: <b>${total}</b></span>
  <span class="pill">Itens (% Ating.): <b>${itemCols.length}</b></span>`;
}
function makeSection(itemCol){
  const colP=prefixCol,colA=agenciaCol,emptyAsZero=$('#emptyAsZero').checked;
  const uniq=uniqByPrefixAgencia(rows,colP,colA),zeros=[];
  for(const r of uniq){
    const raw=r[itemCol];const n=toNumberBR(raw);const empty=raw==null||String(raw).trim()==='';
    if(n===0||(emptyAsZero&&(empty||n==null)))zeros.push({[colP]:r[colP],[colA]:r[colA]});
  }
  cache[itemCol]=zeros;
  const div=document.createElement('div');div.className='card';
  div.innerHTML=`<div class="head"><div class="title">${itemCol} <span class="badge">${zeros.length}</span></div>
    <button class="btn ghost">Baixar CSV</button></div>`;
  div.querySelector('button').onclick=()=>download(`${itemCol.replace(/[^\w\-]+/g,'_')}.csv`,toCSV(zeros,[colP,colA]));
  if(!zeros.length){const p=document.createElement('div');p.className='empty';p.textContent='Nenhuma agência zerada neste item.';div.appendChild(p);}
  else{
    const tbl=document.createElement('table');
    tbl.innerHTML=`<thead><tr><th>${colP}</th><th>${colA}</th></tr></thead>
    <tbody>${zeros.map(o=>`<tr><td>${o[colP]??''}</td><td>${o[colA]??''}</td></tr>`).join('')}</tbody>`;
    div.appendChild(tbl);
  }
  return div;
}

$('#file').addEventListener('change',async e=>{
  const f=e.target.files?.[0];if(!f)return;
  try{
    const text=await f.text();
    rows=parseCSV(text);if(!rows.length)throw new Error('CSV sem dados');
    headers=Object.keys(rows[0]||{}).map(cleanHeader);
    prefixCol=guess(headers,['prefixo','pref','prefix']);
    agenciaCol=guess(headers,['agência','agencia','unidade','ag']);
    itemCols=headers.filter(isPctAtingHeader);
    fillSelect($('#colPrefixo'),headers,prefixCol);
    fillSelect($('#colAgencia'),headers,agenciaCol);
    $('#colPrefixo').disabled=false;$('#colAgencia').disabled=false;
    $('#analisar').disabled=itemCols.length===0;
    renderResumo();
    $('#saida').innerHTML='';$('#baixarTudo').disabled=true;
    if(itemCols.length===0)alert('Nenhuma coluna com "% de Atingimento" encontrada.');
  }catch(err){
    alert('Erro ao ler o CSV: '+err.message);
    console.error(err);
  }
});

$('#colPrefixo').onchange=e=>{prefixCol=e.target.value;renderResumo();}
$('#colAgencia').onchange=e=>{agenciaCol=e.target.value;renderResumo();}

$('#analisar').onclick=()=>{
  if(!prefixCol||!agenciaCol){alert('Selecione Prefixo e Agência.');return;}
  if(!itemCols.length){alert('Nenhum item detectado.');return;}
  $('#saida').innerHTML='';cache={};
  for(const item of itemCols)$('#saida').appendChild(makeSection(item));
  $('#baixarTudo').disabled=false;
};
$('#baixarTudo').onclick=()=>{
  const colP=prefixCol,colA=agenciaCol;let out='';
  for(const item of itemCols){
    const csv=toCSV(cache[item]||[],[colP,colA]);
    out+=`===== ${item} =====\n${csv}\n\n`;
  }
  download('todos_os_itens.txt',out);
};
</script>
</body>
</html>
