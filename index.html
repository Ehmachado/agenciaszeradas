<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agências Zeradas por % de Atingimento</title>

<!-- Biblioteca XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js"></script>

<style>
  :root{
    --bb-blue:#003399; --bb-yellow:#FFCC00;
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --bg1:#f6f8ff; --bg2:#ffffff; --accent:#1e3a8a;
    --radius-xl:24px; --radius:16px; --shadow-lg:0 18px 50px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:28px;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color:var(--ink);
    background: linear-gradient(180deg, #f4f6fc 0%, #fff 100%);
  }
  .wrap{max-width:1200px; margin:0 auto}
  h1{font-size:28px; margin:0 0 10px}
  .sub{color:var(--muted); margin-bottom:16px}
  .card{
    background:var(--bg2); border:1px solid var(--line);
    border-radius:var(--radius-xl); box-shadow:var(--shadow-lg);
    padding:22px; margin:18px 0;
  }
  .row{display:grid; gap:14px}
  @media(min-width:860px){ .row.cols-2{grid-template-columns:1fr 1fr} }
  label{font-weight:700; font-size:14px; display:block; margin-bottom:8px}
  select, input[type="file"], button{
    width:100%; padding:12px 14px; border:1px solid var(--line);
    border-radius:14px; background:#fff; font-size:14px;
  }
  .hint{font-size:12.5px; color:var(--muted); margin-top:6px}
  .btn{
    background:var(--bb-blue); color:#fff; font-weight:800;
    border:none; cursor:pointer; padding:12px 16px; border-radius:12px;
  }
  .btn:hover{opacity:.9}
  .btn.ghost{background:#fff; color:var(--bb-blue); border:1px solid var(--bb-blue)}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap}
  .pill{background:#eef2ff; border:1px solid #dfe6ff; color:#0b1a66;
        padding:8px 12px; border-radius:999px; font-weight:700; font-size:13px; margin-top:8px;}
  table{
    width:100%; border-collapse:collapse; margin-top:10px; border:1px solid var(--line);
    border-radius:14px; overflow:hidden;
  }
  th, td{padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; font-size:14px}
  th{background:#f9fafb; font-weight:700}
  tbody tr:hover{background:#f3f6ff}
  .section-head{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .title{font-weight:900; font-size:16px; color:var(--accent)}
  .badge{background:var(--bb-yellow); color:#111; padding:4px 10px; border-radius:999px; font-weight:900; font-size:12px}
  .empty{color:var(--muted); font-style:italic; padding:12px 0}
</style>
</head>

<body>
<div class="wrap">
  <h1>Agências com % de Atingimento Zerado</h1>
  <div class="sub">Detecta automaticamente as colunas com “%” e “Atingimento” e exibe as agências com 0% em cada item.</div>

  <div class="card">
    <div class="row cols-2">
      <div>
        <label>Planilha (CSV ou XLSX)</label>
        <input id="file" type="file" accept=".xlsx,.xls,.csv"/>
        <div class="hint">Suporta formatos BR (ex.: 0%, 0,00%, R$ 0,00).</div>
      </div>
      <div>
        <label>Opções</label>
        <input type="checkbox" id="emptyAsZero" checked/> Tratar células vazias como zero
      </div>
    </div>

    <div class="row cols-2" style="margin-top:14px">
      <div>
        <label>Coluna: Prefixo</label>
        <select id="colPrefixo" disabled></select>
      </div>
      <div>
        <label>Coluna: Agência</label>
        <select id="colAgencia" disabled></select>
      </div>
    </div>

    <div class="toolbar" style="margin-top:14px">
      <button id="analisar" class="btn" disabled>Gerar Listas</button>
      <button id="baixarTudo" class="btn ghost" disabled>Baixar Todos os CSVs</button>
    </div>

    <div id="resumo" style="margin-top:10px"></div>
  </div>

  <div id="saida"></div>
</div>

<script>
setTimeout(() => {

  const $ = s => document.querySelector(s);
  let rows = [], headers = [], prefixCol, agenciaCol, itemCols = [], cache = {};

  function cleanHeader(h){ return String(h||'').trim(); }
  function guess(hdrs, keys){
    const lc = hdrs.map(h=>[h,h.toLowerCase()]);
    for(const k of keys){
      const hit = lc.find(([o,l])=>l.includes(k));
      if(hit) return hit[0];
    }
    return hdrs[0]||'';
  }
  function isPctAtingHeader(h){
    const s=h.toLowerCase(); return s.includes('%') && s.includes('ating');
  }
  function toNumberBR(v){
    if(v===null||v===undefined) return null;
    if(typeof v==='number') return v;
    let s=String(v).trim();
    if(s==='') return null;
    s=s.replace(/\s+/g,'').replace(/%/g,'').replace(/R\$/gi,'');
    if(s.match(/\d\.\d{3}/)&&s.includes(',')){s=s.replace(/\./g,'').replace(',','.');}
    else if(s.includes(',')){s=s.replace(',','.');}
    s=s.replace(/[^0-9\.\-]/g,'');
    if(s===''||s==='-'||s==='.') return null;
    const n=Number(s);
    return Number.isFinite(n)?n:null;
  }
  function uniqByPrefixAgencia(items, colP, colA){
    const m=new Map();
    for(const r of items){
      const p=(r[colP]??'').toString().trim(), a=(r[colA]??'').toString().trim();
      if(!p&&!a) continue; m.set(`${p}||${a}`,r);
    }
    return Array.from(m.values());
  }
  function renderResumo(){
    const total=new Set(rows.map(r=>`${(r[prefixCol]??'').toString().trim()}||${(r[agenciaCol]??'').toString().trim()}`)).size;
    $('#resumo').innerHTML=`<span class="pill">Agências únicas: <b>${total}</b></span>
    <span class="pill">Itens (% Atingimento): <b>${itemCols.length}</b></span>`;
  }
  function sanitizeName(s){return s.replace(/[^\w\-]+/g,'_');}
  function toCSV(rows,cols){
    const esc=s=>`"${String(s??'').replace(/"/g,'""')}"`;
    const out=[cols.map(esc).join(',')];
    for(const r of rows) out.push(cols.map(c=>esc(r[c])).join(','));
    return out.join('\n');
  }
  function download(name,content){
    const blob=new Blob([content],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
  }
  function makeTableFor(itemCol){
    const colP=prefixCol, colA=agenciaCol, emptyAsZero=$('#emptyAsZero').checked;
    const uniq=uniqByPrefixAgencia(rows,colP,colA), zeradas=[];
    for(const r of uniq){
      const raw=r[itemCol], n=toNumberBR(raw);
      const empty=raw==null||String(raw).trim()==='';
      if(n===0||(emptyAsZero&&(empty||n==null)))
        zeradas.push({[colP]:r[colP],[colA]:r[colA]});
    }
    zeradas.sort((x,y)=>{
      const a=`${x[colP]??''}${x[colA]??''}`, b=`${y[colP]??''}${y[colA]??''}`;
      return a.localeCompare(b,'pt-BR',{numeric:true});
    });
    cache[itemCol]=zeradas;

    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<div class="section-head">
        <div class="title">${itemCol} <span class="badge">${zeradas.length}</span></div>
        <button class="btn ghost" onclick='download("${sanitizeName(itemCol)}.csv",\`${toCSV(zeradas,[colP,colA])}\` )'>Baixar CSV</button>
      </div>`;
    if(zeradas.length){
      const tbl=document.createElement('table');
      tbl.innerHTML=`<thead><tr><th>${colP}</th><th>${colA}</th></tr></thead>
        <tbody>${zeradas.map(o=>`<tr><td>${o[colP]??''}</td><td>${o[colA]??''}</td></tr>`).join('')}</tbody>`;
      div.appendChild(tbl);
    } else {
      const p=document.createElement('div');
      p.className='empty'; p.textContent='Nenhuma agência zerada neste item.';
      div.appendChild(p);
    }
    return div;
  }

  // Evento upload
  $('#file').addEventListener('change', async e=>{
    const f=e.target.files?.[0]; if(!f) return;
    try{
      const data=await f.arrayBuffer();
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      headers=Object.keys(rows[0]||{}).map(cleanHeader);
      prefixCol=guess(headers,['prefixo','pref','prefix']);
      agenciaCol=guess(headers,['agência','agencia','unidade','ag']);
      itemCols=headers.filter(isPctAtingHeader);
      fillSelect($('#colPrefixo'),headers,prefixCol);
      fillSelect($('#colAgencia'),headers,agenciaCol);
      $('#colPrefixo').disabled=false; $('#colAgencia').disabled=false;
      $('#analisar').disabled=itemCols.length===0;
      renderResumo();
      if(itemCols.length===0) alert('Nenhuma coluna com "% de Atingimento" encontrada.');
    }catch(err){
      alert('Erro ao ler a planilha: '+err.message);
      console.error(err);
    }
  });

  $('#analisar').addEventListener('click',()=>{
    if(!prefixCol||!agenciaCol){alert('Selecione Prefixo e Agência.');return;}
    $('#saida').innerHTML=''; cache={};
    for(const item of itemCols) $('#saida').appendChild(makeTableFor(item));
    $('#baixarTudo').disabled=false;
  });

  $('#baixarTudo').addEventListener('click',()=>{
    const colP=prefixCol, colA=agenciaCol;
    let out='';
    for(const item of itemCols){
      const csv=toCSV(cache[item]||[],[colP,colA]);
      out+=`===== ${item} =====\n${csv}\n\n`;
    }
    download('todos_os_itens.txt',out);
  });

  function fillSelect(sel,opts,selVal){
    sel.innerHTML='';
    for(const o of opts){
      const op=document.createElement('option'); op.value=o; op.textContent=o;
      sel.appendChild(op);
    }
    if(selVal) sel.value=selVal;
  }

},500);
</script>
</body>
</html>
